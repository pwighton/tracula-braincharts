[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tracula-braincharts"
version = "0.1.0.dev0"
description = "Apply the BLR_fa_lifespan_24K_19sites FA normative model to Tracula subjects, with local site adaptation"
readme = "README.md"
license = {file = "LICENSE"}
# pcntoolkit 0.35 (needed to load the model pickles) supports Python 3.10-3.12
requires-python = ">=3.10,<3.13"
dependencies = [
    "pcntoolkit==0.35.0",
    "numpy",
    "pandas",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
tracula-braincharts = "tracula_braincharts.cli:main"

[tool.setuptools.packages.find]
include = ["tracula_braincharts*"]

[tool.setuptools.package-data]
tracula_braincharts = ["data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
